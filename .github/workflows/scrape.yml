name: Scraping automatique des offres

on:
  schedule:
    - cron: "0 7,12,17,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraping-offres
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Cache modèle sentence-transformers
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-${{ runner.os }}-minilm

      - name: Cache navigateur Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v2-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Installer Playwright (navigateur + dépendances système)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Installer dépendances système Playwright (si cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Lancer le scraping + scoring
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: python refresh.py

      - name: Commit la base mise à jour
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.db
          git diff --staged --quiet || git commit -m "Mise à jour automatique des offres"
          git pull --rebase origin main
          git push